<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
        }

        .login-box {
            width: 360px;
            margin: 120px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        .error {
            margin-top: 15px;
            color: #b00000;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Вход</h1>

    <form method="post" action="/login">
    <input type="text" name="username" placeholder="Логин" required>
    <input type="password" name="password" placeholder="Пароль" required>

    <button type="submit">Войти</button>
</form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <a class="back-link" href="/">← Вернуться на сайт</a>
</div>

</body>
</html>
